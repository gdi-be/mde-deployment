services:
  mde-nginx:
    container_name: mde-nginx
    hostname: mde-nginx
    image: nginx
    restart: always
    volumes:
      - ./mde-nginx/test/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./mde-nginx/test/gdi-con-t-server.selfsign.crt:/etc/nginx/ssl/private/gdi-con-t-server.selfsign.crt:ro,Z
      - ./mde-nginx/test/gdi-con-t-server.key:/etc/nginx/ssl/private/gdi-con-t-server.key:ro,Z
    ports:
      - 80:80
      - 443:443
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost"]
      interval: 5m
      timeout: 3s
      start_period: 30s
    depends_on:
      - mde-gnos
      - mde-backend
      - mde-client
      - mde-keycloak
  mde-postgres:
    container_name: mde-postgres
    hostname: mde-postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - ./mde-postgres/postgresql_data:/var/lib/postgresql/data:Z
      - ./mde-postgres/init_data/01_init_keycloak.sql:/docker-entrypoint-initdb.d/01_init_keycloak.sql:ro,Z
      - ./mde-postgres/init_data/02_init_mde_db.sql:/docker-entrypoint-initdb.d/02_init_mde_db.sql:ro,Z
      - ./mde-postgres/init_data/03_init_gnos_db.sql:/docker-entrypoint-initdb.d/03_init_gnos_db.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
  mde-keycloak:
    container_name: mde-keycloak
    hostname: mde-keycloak
    image: quay.io/keycloak/keycloak:26.7.5
    restart: always
    depends_on:
      - mde-postgres
    environment:
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: mde-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_PATH: /auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    command:
      [
        "start",
        "--proxy-headers",
        "xforwarded",
        "--http-enabled",
        "true",
        "-Dcom.sun.jndi.ldap.object.disableEndpointIdentification=true",
      ]
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /auth/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # volumes:
    #   - ./mde-keycloak/cacerts:/etc/pki/ca-trust/extracted/java/cacerts:Z
  mde-gnos:
    container_name: mde-gnos
    hostname: mde-gnos
    image: geonetwork:4.4.12
    restart: always
    depends_on:
      - mde-postgres
      - mde-elasticsearch
    environment:
      GN_CONFIG_PROPERTIES: >-
        -Des.host=mde-elasticsearch
        -Des.protocol=http
        -Des.port=9200
        -Des.url=http://mde-elasticsearch:9200
        -Dgeonetwork.dir=/var/lib/geonetwork_data
        -Dgeonetwork.db.type=postgres
      GEONETWORK_DB_USERNAME: ${POSTGRES_USER}
      GEONETWORK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GEONETWORK_DB_NAME: gnos
      GEONETWORK_DB_HOST: mde-postgres
      GEONETWORK_DB_PORT: 5432
    volumes:
      - ./mde-geonetwork/gn-public-data:/var/lib/geonetwork-data:Z
      - ./mde-geonetwork/logs/:/var/lib/jetty/logs/:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geonetwork/srv/eng/info?type=me"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  mde-elasticsearch:
    image: elasticsearch:8.18.0
    container_name: mde-elasticsearch
    hostname: mde-elasticsearch
    restart: always
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: 512000
        hard: 512000
      nofile:
        soft: 65536
        hard: 65536
    group_add:
      - 0
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - ./mde-elasticsearch/esdata-public:/usr/share/elasticsearch/data:Z
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  mde-backend:
    image: ghcr.io/gdi-be/mde-backend:6.0.0
    container_name: mde-backend
    hostname: mde-backend
    restart: always
    depends_on:
      - mde-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      VARIABLE_FILE: ${VARIABLE_FILE}
      CSW_SERVER: ${CSW_SERVER}
      CSW_USER: ${CSW_USER}
      CSW_PASSWORD: ${CSW_PASSWORD}
      CODELISTS_DIR: ${CODELISTS_DIR}
      TE_BASE: "/tmp/teamengine"
      JAVA_TOOL_OPTIONS: "-Dlog4j2.configurationFile=/config/log4j2.properties"
      CLEANUP_USERS_ENABLED: false
      CLEANUP_USERS_CRON: "0 0 0 ? * MON-FRI" # Every weekday at midnight
    volumes:
      - ./mde-backend/lucene:/lucene:Z
      # - ./mde-backend/keystore/cacerts:/opt/java/openjdk/lib/security/cacerts:ro,Z
      - ./mde-backend/variables.json:/variables.json:ro,Z
      - ./mde-backend/log4j2.properties:/config/log4j2.properties:ro,Z
      - ./codelists:/data/codelists:ro,Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v3/api-docs/swagger-config"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
  mde-client:
    image: ghcr.io/gdi-be/mde-client:6.4.1
    container_name: mde-client
    hostname: mde-client
    restart: always
    env_file:
      - .client-env
    volumes:
      - ./.client-env:/app/.env:ro,Z
      - ./mde-client-codelists:/data/codelists:ro,Z
      - ./mde-client/variables.json:/data/variables.json:ro,Z
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
